<!doctype html>
<!--
  Social card for engine-packing.vercel.app. With `npm run dev` running, open
  /scripts/og/og.html at 1200 × 630 (device scale 2), screenshot it, and scale
  the result to public/og.jpg. scene.jpg is a 2000 × 630 capture of the site
  firing n = 33 with the UI hidden.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Engine packing social card</title>
    <script type="module">
      import '@fontsource-variable/archivo/wdth.css';
    </script>
    <style>
      :root {
        --cream: #f7e9d4;
        --cream-dim: rgba(247, 233, 212, 0.74);
        --steel: #a3b1c8;
        --ember: #f2a25c;
        --font: 'Archivo Variable', system-ui, sans-serif;
      }

      html,
      body {
        margin: 0;
        background: #061847;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: var(--font);
        color: var(--cream);
        -webkit-font-smoothing: antialiased;
      }

      .scene {
        position: absolute;
        top: 0;
        left: -150px;
        width: 2000px;
        height: 630px;
        background: url('./scene.jpg') center / cover;
      }

      .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(3, 11, 34, 0.94) 0, rgba(3, 11, 34, 0.8) 36%, rgba(3, 11, 34, 0) 64%),
          linear-gradient(to top, rgba(3, 11, 34, 0.55) 0, rgba(3, 11, 34, 0) 40%);
      }

      .content {
        position: absolute;
        inset: 0;
        padding: 64px 72px 60px;
        display: flex;
        flex-direction: column;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        font-weight: 620;
        font-stretch: 118%;
        letter-spacing: -0.005em;
      }

      .brand svg {
        width: 34px;
        height: 34px;
      }

      h1 {
        margin: 34px 0 0;
        max-width: 560px;
        font-size: 58px;
        font-weight: 560;
        font-stretch: 112%;
        line-height: 1.04;
        letter-spacing: -0.02em;
      }

      .stats {
        margin-top: auto;
        display: flex;
        gap: 52px;
      }

      .stat b {
        display: block;
        font-size: 60px;
        font-weight: 190;
        font-stretch: 125%;
        line-height: 0.9;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums lining-nums;
      }

      .stat:last-child b {
        color: var(--ember);
      }

      .stat span {
        display: block;
        margin-top: 12px;
        max-width: 17ch;
        font-size: 17px;
        line-height: 1.3;
        color: var(--cream-dim);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="scene"></div>
      <div class="scrim"></div>
      <div class="content">
        <div class="brand">
          <svg viewBox="-1.1 -1.1 2.2 2.2" aria-hidden="true">
            <circle r="1.06" fill="none" stroke="#f7e9d4" stroke-width="0.08" />
            <g fill="#f7e9d4">
              <circle r="0.3" />
              <circle cx="0.666" r="0.3" /><circle cx="-0.666" r="0.3" />
              <circle cx="0.333" cy="0.577" r="0.3" /><circle cx="-0.333" cy="0.577" r="0.3" />
              <circle cx="0.333" cy="-0.577" r="0.3" /><circle cx="-0.333" cy="-0.577" r="0.3" />
            </g>
          </svg>
          Engine packing
        </div>
        <h1>Rocket engines, packed like circles</h1>
        <div class="stats">
          <div class="stat"><b>100</b><span>optimal engine layouts to fire</span></div>
          <div class="stat"><b>9</b><span>real rockets to compare</span></div>
          <div class="stat"><b>14&nbsp;%</b><span>wider nozzles than<br />Super Heavy’s rings</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
